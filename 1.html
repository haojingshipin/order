*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:#f4f5f7;color:#222;padding-bottom:90px}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#2c3a4a,#1f2a36);color:#fff;padding:12px 14px}
header h1{font-size:18px;font-weight:700}
header .sub{font-size:12px;color:#c9d4de;margin-top:2px}
.search{margin-top:8px}
.search input{width:100%;padding:9px 12px;border:none;border-radius:20px;font-size:14px;outline:none}
.cats{position:sticky;top:0;z-index:40;background:#f4f5f7;padding:10px 10px 6px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap}
.cats::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:18px;background:#fff;border:1px solid #ddd;font-size:13px;cursor:pointer;flex-shrink:0}
.chip.on{background:#e8a33d;color:#fff;border-color:#e8a33d;font-weight:700}
.sec{background:#fff;border-radius:10px;margin:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec h2{background:#e8a33d;color:#fff;font-size:15px;padding:9px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#eee}
.card{background:#fff;padding:10px;display:flex;flex-direction:column}
.card .pic{width:100%;height:110px;object-fit:contain;background:#fafafa;border-radius:8px;margin-bottom:6px;display:block}
.card .nm{font-size:13px;font-weight:700;line-height:1.35;min-height:35px}
.card .sp{font-size:12px;color:#666;margin:3px 0}
.card .pr{font-size:17px;font-weight:800;color:#c0392b}
.card .pr small{font-size:11px;color:#999;font-weight:400}
.card .up{font-size:11px;color:#888}
.step{display:flex;align-items:center;gap:8px;margin-top:8px}
.step button{width:30px;height:30px;border-radius:50%;border:1px solid #e8a33d;background:#fff;color:#e8a33d;font-size:18px;font-weight:700;cursor:pointer}
.step button:active{background:#e8a33d;color:#fff}
.step .q{flex:1;text-align:center;font-size:15px;font-weight:700;min-width:20px}
.cartbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#2c3a4a;color:#fff;display:flex;align-items:center;padding:12px 14px;gap:10px}
.cartbar .info{flex:1;font-size:13px}
.cartbar .info b{font-size:17px;color:#ffd27f}
.cartbar button{background:#e8a33d;border:none;color:#fff;font-size:15px;font-weight:700;padding:11px 22px;border-radius:22px;cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end}
.mask.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:18px 16px 24px}
.modal h3{font-size:17px;margin-bottom:12px}
.oline{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed #eee}
.modal textarea{width:100%;height:70px;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:14px;margin:10px 0;resize:none}
.btnrow{display:flex;gap:10px}
.btnrow button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.btnrow .b1{background:#25d366;color:#fff}
.btnrow .b2{background:#2c3a4a;color:#fff}
.btnrow .b3{background:#eee;color:#333}
/* admin */
.apanel{padding:12px}
.apanel h3{background:#2c3a4a;color:#fff;padding:10px 14px;font-size:16px}
.arow{display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid #eee;font-size:13px}
.arow .n{flex:1}
.arow .p{color:#c0392b;font-weight:700;width:60px;text-align:right}
.arow button{padding:5px 9px;border:none;border-radius:6px;font-size:12px;cursor:pointer}
.arow .e{background:#e8a33d;color:#fff}
.arow .d{background:#e74c3c;color:#fff}
.aform{background:#fff;margin:12px;padding:12px;border-radius:10px}
.aform input,.aform select{width:100%;padding:9px;margin:4px 0;border:1px solid #ccc;border-radius:8px;font-size:14px}
.aform label{font-size:13px;color:#555;font-weight:700}
.aform button{width:100%;padding:12px;background:#e8a33d;border:none;color:#fff;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;margin-top:8px}
.aset{background:#fff;margin:12px;padding:12px;border-radius:10px;font-size:13px}
.aset input{width:100%;padding:9px;margin:4px 0;border:1px solid #ccc;border-radius:8px;font-size:14px}
.aset button{padding:9px 14px;background:#2c3a4a;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:4px 4px 0 0}
.adminlink{text-align:center;font-size:12px;color:#aaa;padding:14px;cursor:pointer}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:200;display:none}
.hidden{display:none!important}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style>

<script>
let storedVer=parseInt(localStorage.getItem("lj_ver")||"1");
let products=JSON.parse(localStorage.getItem("lj_products")||"null");
let settings=JSON.parse(localStorage.getItem("lj_settings")||"null");
if(!products){products=DEFAULT_PRODUCTS.map((p,i)=>({id:i+1,cat:p[0],name:p[1],spec:p[2],price:p[3],unit:p[4],img:p[5]||""}));}
if(!settings){settings={shop:"瀝景調味品批發",pass:"8888",wa:"8536XXXXXXX"};}
// 資料版本升級：按產品名稱從預設清單補上圖片欄位（不影響你已修改的價格/產品）
if(storedVer<DATA_VER){
  const byName={};DEFAULT_PRODUCTS.forEach(p=>byName[p[1]]=p[5]||"");
  products.forEach(p=>{if(p.img===undefined)p.img=byName[p.name]||"";});
  localStorage.setItem("lj_ver",DATA_VER);
}
function save(){localStorage.setItem("lj_products",JSON.stringify(products));localStorage.setItem("lj_settings",JSON.stringify(settings));}
save();

let cart={},curCat="全部",kw="",isAdmin=false,editId=null;

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",1500);}
function cats(){const seen=[];products.forEach(p=>{if(!seen.includes(p.cat))seen.push(p.cat)});return seen;}
function cartCount(){return Object.values(cart).reduce((a,b)=>a+b,0);}
function cartTotal(){return Object.entries(cart).reduce((s,[id,q])=>{const p=products.find(x=>x.id==id);return p?s+p.price*q:s;},0);}
function esc(s){return String(s||"").replace(/"/g,"&quot;");}

function render(){
  const app=document.getElementById("app");
  if(isAdmin){renderAdmin(app);return;}
  let h=`<header><h1>${settings.shop} <span style="font-size:12px;color:#ffd27f">線上下單</span></h1>
  <div class="sub">選好產品數量，按「提交訂單」即可，不用填地址</div>
  <div class="search"><input id="kw" placeholder="🔍 搜尋產品…" value="${kw}" oninput="kw=this.value;renderBody()"></div></header>
  <div class="cats" id="cats"></div><div id="body"></div>`;
  app.innerHTML=h;
  renderBody();
}
function renderBody(){
  const list=cats();
  let chips=["全部",...list].map(c=>`<div class="chip ${c===curCat?"on":""}" onclick="curCat='${c}';render()">${CAT_EMOJI[c]||""}${c}</div>`).join("");
  document.getElementById("cats").innerHTML=chips;
  let h="";
  const show=list.filter(c=>curCat==="全部"||c===curCat);
  show.forEach(c=>{
    let items=products.filter(p=>p.cat===c);
    if(kw)items=items.filter(p=>(p.name+p.spec).toLowerCase().includes(kw.toLowerCase()));
    if(!items.length)return;
    h+=`<div class="sec"><h2>${CAT_EMOJI[c]||""} ${c}</h2><div class="grid">`;
    items.forEach(p=>{
      const q=cart[p.id]||0;
      const pic=p.img?`<img class="pic" src="${esc(p.img)}" loading="lazy" onerror="this.style.display='none'">`:"";
      h+=`<div class="card">${pic}<div class="nm">${p.name}</div><div class="sp">${p.spec}</div>
      <div class="pr">$${p.price} <small>/件</small></div><div class="up">${p.unit}</div>
      <div class="step"><button onclick="chq(${p.id},-1)">−</button><div class="q">${q||""}</div><button onclick="chq(${p.id},1)">＋</button></div></div>`;
    });
    h+=`</div></div>`;
  });
  if(!h)h="<p style='text-align:center;color:#999;padding:40px'>找不到產品</p>";
  document.getElementById("body").innerHTML=h+`<div class="adminlink" onclick="adminLogin()">⚙️ 管理入口</div>`;
  const cc=cartCount(),ct=cartTotal();
  let cb=document.getElementById("cartbar");
  if(!cb){cb=document.createElement("div");cb.id="cartbar";cb.className="cartbar";document.body.appendChild(cb);}
  cb.style.display=cc>0?"flex":"none";
  cb.innerHTML=`<div class="info">已選 <b>${cc}</b> 件貨 · 合計 <b>$${ct}</b></div><button onclick="checkout()">提交訂單</button>`;
}
function chq(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];renderBody();}

function orderText(note){
  let t=`【${settings.shop} 訂單】\n`,i=1;
  Object.entries(cart).forEach(([id,q])=>{const p=products.find(x=>x.id==id);
    t+=`${i++}. ${p.name}（${p.spec}）×${q} = $${p.price*q}\n`;});
  t+=`----------------\n合計：$${cartTotal()}`;
  if(note)t+=`\n備註：${note}`;
  return t;
}
function checkout(){
  const cc=cartCount();if(!cc)return;
  const mask=document.createElement("div");mask.className="mask show";mask.id="mask";
  let lines=Object.entries(cart).map(([id,q])=>{const p=products.find(x=>x.id==id);
    return `<div class="oline"><span>${p.name} ×${q}</span><span>$${p.price*q}</span></div>`;}).join("");
  mask.innerHTML=`<div class="modal"><h3>確認訂單（共 ${cc} 件，合計 $${cartTotal()}）</h3>${lines}
  <textarea id="note" placeholder="備註（可留空，例如送貨時間）"></textarea>
  <div class="btnrow">
    <button class="b1" onclick="sendWA()">WhatsApp 送出</button>
    <button class="b2" onclick="copyOrder()">複製訂單</button>
  </div>
  <div class="btnrow" style="margin-top:10px"><button class="b3" onclick="closeMask()">繼續選購</button></div></div>`;
  document.body.appendChild(mask);
}
function closeMask(){const m=document.getElementById("mask");if(m)m.remove();}
function copyOrder(){
  const note=document.getElementById("note").value;
  navigator.clipboard.writeText(orderText(note)).then(()=>{toast("訂單已複製，可貼到微信/WhatsApp 發給我們");});
}
function sendWA(){
  const note=document.getElementById("note").value;
  const num=(settings.wa||"").replace(/[^0-9]/g,"");
  if(!num){toast("老闆還未設定 WhatsApp 號碼，請先複製訂單");return;}
  window.open("https://wa.me/"+num+"?text="+encodeURIComponent(orderText(note)),"_blank");
  cart={};closeMask();renderBody();
}

/* ===== 管理後台 ===== */
function adminLogin(){
  const p=prompt("請輸入管理密碼（預設 8888）：");if(p===null)return;
  if(p===settings.pass){isAdmin=true;render();window.scrollTo(0,0);}else toast("密碼錯誤");
}
function renderAdmin(app){
  const list=cats();
  let h=`<div class="apanel"><h3>⚙️ 產品管理（點下方返回顧客頁）</h3></div>`;
  h+=`<div class="aform"><b style="font-size:15px">${editId?"修改產品":"新增產品"}</b>
  <label>分類</label><select id="f_cat">${list.map(c=>`<option>${c}</option>`).join("")}</select>
  <label>產品名稱</label><input id="f_name" placeholder="例如：廚邦醬油（小）">
  <label>規格</label><input id="f_spec" placeholder="例如：410ML*12">
  <label>價格（$/件）</label><input id="f_price" type="number" placeholder="例如：110">
  <label>單價說明（可留空）</label><input id="f_unit" placeholder="例如：每瓶 $9.17">
  <label>圖片（可留空。填 img/檔名.jpg 或任何圖片網址）</label><input id="f_img" placeholder="例如：img/老乾媽風味豆豉.jpg">
  <button onclick="saveForm()">${editId?"保存修改":"＋ 新增產品"}</button>
  ${editId?`<button style="background:#999" onclick="editId=null;render()">取消修改</button>`:""}</div>`;
  h+=`<div class="aform"><b style="font-size:15px">產品清單（共 ${products.length} 款）</b><br><br>`;
  list.forEach(c=>{
    h+=`<div style="background:#e8a33d;color:#fff;padding:5px 10px;border-radius:6px;margin:6px 0 2px;font-size:13px;font-weight:700">${CAT_EMOJI[c]||""} ${c}</div>`;
    products.filter(p=>p.cat===c).forEach(p=>{
      h+=`<div class="arow">${p.img?`<img src="${esc(p.img)}" style="width:30px;height:30px;object-fit:contain;border-radius:4px;background:#f4f5f7">`:""}<div class="n">${p.name} <span style="color:#999">${p.spec}</span></div><div class="p">$${p.price}</div>
      <button class="e" onclick="editProd(${p.id})">改</button><button class="d" onclick="delProd(${p.id})">刪</button></div>`;
    });
  });
  h+=`</div>`;
  h+=`<div class="aset"><b style="font-size:15px">設定</b><br><br>
  <label>店舖名稱</label><input id="s_shop" value="${settings.shop}"><br>
  <label>收單 WhatsApp 號碼（區號+號碼，例如 85361234567）</label><input id="s_wa" value="${settings.wa}"><br>
  <label>管理密碼</label><input id="s_pass" value="${settings.pass}"><br>
  <button onclick="saveSettings()">保存設定</button>
  <button onclick="exportData()">備份資料</button>
  <button onclick="importData()">還原資料</button></div>`;
  h+=`<div class="adminlink" onclick="isAdmin=false;render()">⬅ 返回顧客下單頁</div>`;
  app.innerHTML=h;
}
function saveForm(){
  const cat=document.getElementById("f_cat").value,name=document.getElementById("f_name").value.trim(),
  spec=document.getElementById("f_spec").value.trim(),price=parseFloat(document.getElementById("f_price").value),
  unit=document.getElementById("f_unit").value.trim(),
  img=document.getElementById("f_img").value.trim();
  if(!name||!price){toast("請填名稱和價格");return;}
  if(editId){const p=products.find(x=>x.id===editId);Object.assign(p,{cat,name,spec,price,unit,img});toast("已修改");}
  else{products.push({id:Date.now(),cat,name,spec,price,unit,img});toast("已新增");}
  save();editId=null;render();
}
function editProd(id){
  editId=id;const p=products.find(x=>x.id===id);render();
  setTimeout(()=>{document.getElementById("f_cat").value=p.cat;document.getElementById("f_name").value=p.name;
  document.getElementById("f_spec").value=p.spec;document.getElementById("f_price").value=p.price;
  document.getElementById("f_unit").value=p.unit;
  document.getElementById("f_img").value=p.img||"";window.scrollTo(0,0);},50);
}
function delProd(id){if(confirm("確定刪除此產品？")){products=products.filter(p=>p.id!==id);save();render();}}
function saveSettings(){settings.shop=document.getElementById("s_shop").value;settings.wa=document.getElementById("s_wa").value;settings.pass=document.getElementById("s_pass").value;save();toast("設定已保存");}
function exportData(){navigator.clipboard.writeText(JSON.stringify({products,settings})).then(()=>toast("資料已複製，請貼到記事本保存"));}
function importData(){const t=prompt("請貼上之前備份的資料：");if(!t)return;try{const d=JSON.parse(t);products=d.products;settings=d.settings;save();render();toast("已還原");}catch(e){toast("資料格式錯誤");}}
render();
</script>
